apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
  namespace: task-management
spec:
  replicas: 3

  selector:
    matchLabels:
      app: task-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  template:
    metadata:
      labels:
        app: task-api

    spec:
      containers:
        - name: task-api
          image: task-api:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: task-api-config
            - secretRef:
                name: task-api-secret

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi